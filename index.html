<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        // Apply the saved theme before the stylesheets and React load.
        try {
            if (localStorage.getItem("theme") === "dark") {
                document.documentElement.dataset.theme = "dark";
            }
        } catch {
            // The initial light theme still works when storage is unavailable.
        }
    </script>
    <link rel="stylesheet" href="/css/dark-mode.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <link rel="icon" type="image/png" href="/src/assets/icons/icon.png" />
    <title>Web Search App</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
