<!--
  Footer partial, injected at runtime by js/footer-loader.js into the
  #footer-placeholder element present on every page. Behavior (date
  toggle, theme toggle) is wired up afterwards by js/footer.js.
-->
<footer class="site-footer">
  <div class="footer-left">

    <div class="footer-date-card" tabindex="0">
      <i class="fa-solid fa-calendar-days"></i>
      <span id="full-date"></span>
    </div>

    <div class="footer-time-card">
      <i class="fa-solid fa-clock"></i>
      <span id="full-time"></span>
    </div>

  </div>

  <div class="footer-right">

    <!-- Widget Switcher -->
    <div class="widget-dropdown">
      <span class="widget-label">
        <i class="fas fa-layer-group"></i> Widgets
      </span>

      <div class="widget-options">
        <span data-widget="weather" tabindex="0" role="button">Weather</span>
        <span data-widget="crypto" tabindex="0" role="button">Crypto</span>
        <span data-widget="DailyTask" tabindex="0" role="button">Task</span>
        <span data-widget="quick-links" tabindex="0" role="button">Quick links</span>
        <span data-widget="ping" tabindex="0" role="button">Ping</span>
      </div>
    </div>

    <!-- Theme Toggle -->
    <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">
      <i id="theme-icon" class="fas fa-sun"></i>
    </button>

    
    <div class="footer-divider-vertical"></div>


    <!-- Social -->
    <div class="social-icons">
      <a href="https://github.com/KooshaMajl" target="_blank" title="GitHub" rel="noopener">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://www.linkedin.com/in/koosha-majlessi-3b609038b" target="_blank" title="LinkedIn" rel="noopener">
        <i class="fab fa-linkedin"></i>
      </a>
    </div>

  </div>
</footer>
