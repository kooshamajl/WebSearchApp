<div id="weather" class="glass-widget">
  <p id="city"></p>

  <p id="temp" tabindex="0" role="button" aria-label="Toggle temperature unit">
    <span id="tempValue"></span>
    <span id="tempUnit" class="weather-unit">°C</span>
  </p>

  <div class="weather-divider"></div>

  <div class="weather-details">
    <div class="weather-detail" id="weatherLeftMetric" tabindex="0" role="button" aria-label="Cycle weather metric">
      <span class="weather-detail-label" id="weatherLeftLabel">Clouds</span>
      <span class="weather-detail-value" id="weatherLeftValue">--</span>
    </div>

    <div class="weather-detail-sep" aria-hidden="true"></div>

    <div class="weather-detail" id="weatherRightMetric" tabindex="0" role="button" aria-label="Cycle weather metric">
      <span class="weather-detail-label" id="weatherRightLabel">Humidity</span>
      <span class="weather-detail-value" id="weatherRightValue">--</span>
    </div>
  </div>

  <div class="weather-divider"></div>

  <a href="#" id="weatherForecastLink" class="weather-forecast-link">
    <span>View forecast</span>
    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
  </a>
</div>
