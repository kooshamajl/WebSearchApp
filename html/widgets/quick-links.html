<!--
  Quick Links widget: a row of shortcut icons to frequently used sites,
  plus a small "Add" control. The link row itself is rendered by
  js/quick-links.js from localStorage (seeded with the same 6 sites
  this partial used to hard-code) so links can be added/removed and
  survive a reload; see that file for the render/add/remove logic.
-->
<div class="glass-widget" id="quickLinks">
  <div class="quick-links-row" id="quickLinksRow"></div>

  <span class="quick-link-divider" aria-hidden="true"></span>

  <button type="button" class="quick-link-add-btn" id="quickLinkAddBtn" aria-haspopup="dialog"
    aria-expanded="false" aria-label="Add quick link">
    <i class="fa-solid fa-plus" aria-hidden="true"></i>
  </button>

  <div class="quick-link-popover" id="quickLinkPopover" role="dialog" aria-modal="true"
    aria-label="Add quick link">
    <div class="quick-link-popover-row">
      <label for="quickLinkName">Name</label>
      <input type="text" id="quickLinkName" class="quick-link-input" maxlength="24" autocomplete="off"
        placeholder="e.g. Amazon" />
    </div>

    <div class="quick-link-popover-row">
      <label for="quickLinkUrl">URL or site name</label>
      <input type="text" id="quickLinkUrl" class="quick-link-input" maxlength="60" autocomplete="off"
        placeholder="e.g. amazon.com" />
    </div>

    <p class="quick-link-error" id="quickLinkError" aria-live="polite"></p>

    <div class="quick-link-popover-actions">
      <button type="button" class="quick-link-cancel-btn" id="quickLinkCancelBtn">Cancel</button>
      <button type="button" class="quick-link-save-btn" id="quickLinkSaveBtn">Add</button>
    </div>
  </div>
</div>
