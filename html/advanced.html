<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Search</title>
  <meta name="description" content="Advanced search with filters for site, file type, and exact phrase matching.">
  <link rel="icon" type="image/png" href="../pictures/icon.png">
  <link rel="stylesheet" href="../css/main-style.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/widgets.css">
  <link id="dark-mode-css" rel="stylesheet" href="../css/dark-mode.css" disabled>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css">
</head>


<body>

  <main>
    <nav class="search-nav">
      <div class="search-dropdown">
        <span class="search-label"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Search Options</span>

        <div class="search-menu">
          <a href="image.html">Image Search</a>
          <a href="web.html">Web Search</a>
        </div>
      </div>
    </nav>

    <div id="widget-container"></div>

    <div class="advanced-container">
      <h3>Find pages containing:</h3>

      <form action="https://www.google.com/search">
        <div class="row">
          <label for="all">All these words: </label>
          <input class="search-bar" id="all" type="text" name="as_q" maxlength="50" autocomplete="off" />
        </div>

        <div class="row">
          <label for="exact"> Exact word or phrase: </label>
          <input class="search-bar" id="exact" type="text" name="as_epq" maxlength="50" autocomplete="off" />
        </div>

        <div class="row">
          <label for="any"> Any of these words: </label>
          <input class="search-bar" id="any" type="text" name="as_oq" maxlength="50" autocomplete="off" />
        </div>

        <div class="row">
          <label for="none"> None of these words: </label>
          <input class="search-bar" id="none" type="text" name="as_eq" maxlength="50" autocomplete="off" />
        </div>

        <button type="submit" id="search-button" class="search-but">
          <i class="fa-solid fa-filter"></i> Advanced Search
        </button>
      </form>
    </div>

  </main>

  <div id="footer-placeholder"></div>



<script src="../js/footer.js"></script>
<script src="../js/footer-loader.js"></script>
<script src="../js/widget-loader.js"></script>
<script src="../js/weather.js"></script>
<script src="../js/crypto.js"></script>
<script src="../js/DailyTask.js"></script>
<script src="../js/ping.js"></script>

</body>

</html>
