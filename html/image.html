<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Search</title>
  <meta name="description" content="Search Google Images directly from a clean, minimal search bar.">
  <link rel="icon" type="image/png" href="../pictures/icon.png">
  <link rel="stylesheet" href="../css/main-style.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/widgets.css" />
  <link rel="stylesheet" href="../css/image-search.css" />
  <link id="dark-mode-css" rel="stylesheet" href="../css/dark-mode.css" disabled>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css">
</head>

<body>
  <main>
    <nav class="search-nav">
      <div class="search-dropdown">
        <span class="search-label">Search Options <i class="fa-solid fa-chevron-down search-chevron" aria-hidden="true"></i></span>

        <div class="search-menu">
          <a href="advanced.html">Advanced Search</a>
          <a href="web.html">Web Search</a>
        </div>
      </div>
    </nav>

    <div id="widget-container"></div>

    <div class="container">
      <form action="https://www.google.com/search">
        <div class="image-search-wrap">
          <input id="imageSearchInput" class="search-bar" type="text" name="q" placeholder="Search Google Images..."
            maxlength="50" autocomplete="off" aria-label="Search Google Images" />

          <!-- Decorative ghost-text overlay; see js/image-search-autocomplete.js -->
          <div class="ghost-suggestion" aria-hidden="true">
            <span id="ghostTyped"></span><span id="ghostRemainder"></span>
          </div>
        </div>
        <br>
        <input type="hidden" name="tbm" value="isch" />
        <button type="submit" id="search-button" class="search-but">
          <i class="fa-solid fa-image"></i> Image Search
        </button>
      </form>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <script src="../js/image-search-autocomplete.js"></script>
  <script>
    const form = document.querySelector("form");
    const searchInput = document.getElementById("imageSearchInput");

    form.addEventListener("submit", (e) => {
      if (searchInput.value.trim() === "") {
        e.preventDefault();

        searchInput.classList.add("shake");

        setTimeout(() => {
          searchInput.classList.remove("shake");
        }, 300);
      }
    });

    searchInput.focus();

    // Inline "ghost text" suggestions, scoped to this page only.
    // See js/image-search-autocomplete.js for the dataset and logic.
    initImageSearchAutocomplete(
      searchInput,
      document.getElementById("ghostTyped"),
      document.getElementById("ghostRemainder")
    );
  </script>

  <script src="../js/footer.js"></script>
  <script src="../js/footer-loader.js"></script>
  <script src="../js/widget-loader.js"></script>
  <script src="../js/weather.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/DailyTask.js"></script>
  <script src="../js/ping.js"></script>
</body>

</html>
