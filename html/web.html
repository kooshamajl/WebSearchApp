<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Search</title>
  <meta name="description" content="A minimal personal search dashboard with weather, crypto, tasks, and ping widgets.">
  <link rel="icon" type="image/png" href="../pictures/icon.png">
  <link rel="stylesheet" href="../css/main-style.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/widgets.css">
  <link rel="stylesheet" href="../css/history-search.css">
  <link rel="stylesheet" href="../css/search-engine.css">
  <link id="dark-mode-css" rel="stylesheet" href="../css/dark-mode.css" disabled>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css">
</head>

<body>
  <main>
    <nav class="search-nav">
      <div class="search-dropdown">
        <span class="search-label"> Search Options <i class="fa-solid fa-chevron-down search-chevron" aria-hidden="true"></i></span>

        <div class="search-menu">
          <a href="advanced.html">Advanced Search</a>
          <a href="image.html">Image Search</a>
        </div>
      </div>
    </nav>


    <div id="widget-container"></div>

    <div class="container">
      <form id="searchForm">
        <div class="search-wrapper">
          <div class="search-input-wrap">
            <input id="searchInput" class="search-bar" placeholder="Search or enter a URL" type="text" maxlength="32"
              autocomplete="off" role="combobox" aria-expanded="false" aria-controls="autocompleteList"
              aria-autocomplete="list">
            <ul id="autocompleteList" class="autocomplete-list" role="listbox"></ul>

            <div class="engine-select" id="engineSelect">
              <button type="button" class="engine-select-btn" id="engineSelectBtn" aria-haspopup="listbox"
                aria-expanded="false" aria-label="Choose search engine">
                <span class="engine-icon-slot" id="engineIconSlot" aria-hidden="true">
                  <i class="fa-brands fa-google"></i>
                </span>
                <span class="engine-name" id="engineName">Google</span>
                <i class="fa-solid fa-chevron-down engine-chevron" aria-hidden="true"></i>
              </button>

              <ul class="engine-menu" id="engineMenu" role="listbox" aria-label="Search engine">
                <li role="option" data-engine="google" aria-selected="true" tabindex="0">
                  <span class="engine-menu-icon"><i class="fa-brands fa-google"></i></span>
                  <span class="engine-menu-name">Google</span>
                  <i class="fa-solid fa-check engine-check" aria-hidden="true"></i>
                </li>
                <li role="option" data-engine="bing" aria-selected="false" tabindex="-1">
                  <span class="engine-menu-icon">
                    <svg class="engine-badge engine-badge-bing" viewBox="0 0 16 16" aria-hidden="true">
                      <circle class="engine-badge-circle" cx="8" cy="8" r="8" />
                      <text class="engine-badge-text" x="8" y="11.5">b</text>
                    </svg>
                  </span>
                  <span class="engine-menu-name">Bing</span>
                  <i class="fa-solid fa-check engine-check" aria-hidden="true"></i>
                </li>
                <li role="option" data-engine="duckduckgo" aria-selected="false" tabindex="-1">
                  <span class="engine-menu-icon">
                    <svg class="engine-badge engine-badge-ddg" viewBox="0 0 16 16" aria-hidden="true">
                      <circle class="engine-badge-circle" cx="8" cy="8" r="8" />
                      <text class="engine-badge-text" x="8" y="11.5">D</text>
                    </svg>
                  </span>
                  <span class="engine-menu-name">DuckDuckGo</span>
                  <i class="fa-solid fa-check engine-check" aria-hidden="true"></i>
                </li>
              </ul>
            </div>
          </div>
          <button type="submit" class="search-but" id="search-button">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </button>
          <button type="button" id="toggleHistory" title="Shortcut: Ctrl+H">
            <i class="fa-solid fa-clock-rotate-left"></i> History
          </button>
        </div>
        <ul id="historyList"></ul>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>


  <script src="../js/footer.js"></script>
  <script src="../js/footer-loader.js"></script>
  <script src="../js/widget-loader.js"></script>
  <script src="../js/weather.js"></script>
  <script src="../js/crypto.js"></script>
  <script src="../js/DailyTask.js"></script>
  <script src="../js/ping.js"></script>
  <script src="../js/search-engine.js"></script>
  <script src="../js/search.js"></script>


</body>

</html>
